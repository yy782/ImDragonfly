name: CI

on:
  push:
    branches: [main, 更好的io_uring_proactor]
  pull_request:
    branches: [main, 更好的io_uring_proactor]
  workflow_dispatch:

jobs:
  # ═══════════════════════════════════════════════════════════
  # 格式化检查
  # ═══════════════════════════════════════════════════════════
  format-check:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install clang-format
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang-format

      - name: Check code formatting
        run: bash scripts/check_format.sh

  # ═══════════════════════════════════════════════════════════
  # 构建编译
  # ═══════════════════════════════════════════════════════════
  build:
    needs: format-check
    runs-on: ubuntu-24.04

    env:
      CC: clang
      CXX: clang++

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      # ── 安装系统依赖 ──────────────────────────────────────
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            clang \
            cmake \
            make \
            ninja-build \
            liburing-dev \
            libmimalloc-dev \
            libboost-dev \
            libgoogle-glog-dev \
            libabsl-dev \
            libprotobuf-dev \
            protobuf-compiler \
            libgtest-dev \
            googletest \
            python3 \
            python3-pip

      # ── 编译 GTest ────────────────────────────────────────
      - name: Build GTest from source
        run: |
          cd /usr/src/googletest
          sudo cmake -DCMAKE_BUILD_TYPE=Release .
          sudo make -j$(nproc)
          sudo cmake --install . --prefix /usr/local

      # ── CMake 配置 ───────────────────────────────────────
      - name: Configure CMake
        run: |
          cmake \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_TESTS=ON \
            -S . -B build

      # ── 编译 ─────────────────────────────────────────────
      - name: Build
        run: |
          cmake --build build \
            --target imdragonfly db_table_test \
            -j$(nproc)

      # ── 缓存构建产物 ─────────────────────────────────────
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-artifacts
          path: |
            build/imdragonfly
            build/test/db_table_test
          retention-days: 1

  # ═══════════════════════════════════════════════════════════
  # C++ 单元测试
  # ═══════════════════════════════════════════════════════════
  unit-tests:
    needs: build
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ── 安装运行时依赖 ───────────────────────────────────
      - name: Install runtime dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            liburing-dev \
            libmimalloc-dev \
            libboost-dev \
            libgoogle-glog-dev \
            libabsl-dev \
            libprotobuf-dev \
            libgtest-dev \
            googletest

      - name: Build GTest from source
        run: |
          cd /usr/src/googletest
          sudo cmake -DCMAKE_BUILD_TYPE=Release .
          sudo make -j$(nproc)
          sudo cmake --install . --prefix /usr/local
          sudo ldconfig

      # ── 下载构建产物 ─────────────────────────────────────
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: build-artifacts
          path: build

      - name: Make binaries executable
        run: chmod +x build/imdragonfly build/test/db_table_test

      # ── 运行 C++ 单元测试 ────────────────────────────────
      - name: Run db_table_test
        run: |
          mkdir -p test-results
          ./build/test/db_table_test \
            --gtest_output=xml:test-results/db_table_test.xml

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-results
          path: test-results/
          retention-days: 7

  # ═══════════════════════════════════════════════════════════
  # 集成测试 (Redis 协议验证)
  # ═══════════════════════════════════════════════════════════
  integration-tests:
    needs: build
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ── 安装运行时依赖 ───────────────────────────────────
      - name: Install runtime dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            liburing-dev \
            libmimalloc-dev \
            libboost-dev \
            libgoogle-glog-dev \
            libabsl-dev \
            libprotobuf-dev \
            python3 \
            python3-pip \
            python3-venv

      # ── 下载构建产物 ─────────────────────────────────────
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: build-artifacts
          path: build

      - name: Make binaries executable
        run: chmod +x build/imdragonfly build/test/db_table_test

      # ── 运行集成测试 ─────────────────────────────────────
      - name: Run integration tests
        run: bash scripts/run_integration_tests.sh
